upstream frappe-bench-frappe {
        server 127.0.0.1:8000 fail_timeout=0;
}
upstream frappe-bench-socketio-server {
        server 127.0.0.1:9000 fail_timeout=0;
}

# HTTP - Redirect to HTTPS
server {
        listen 80;
        listen [::]:80;
        server_name pos.homezetu.com staging-site;
        return 301 https://$host$request_uri;
}

# HTTPS Server
server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        
        server_name pos.homezetu.com staging-site;
        
        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/pos.homezetu.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pos.homezetu.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        root /home/frappe/frappe-bench/sites;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "same-origin, strict-origin-when-cross-origin";
        
        location /assets {
                try_files $uri =404;
                add_header Cache-Control "max-age=31536000";
        }
        
        location ~ ^/protected/(.*) {
                internal;
                try_files /$host/$1 =404;
        }
        
        location /socket.io {
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header X-Frappe-Site-Name $host;
                proxy_set_header Origin $scheme://$http_host;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_pass http://frappe-bench-socketio-server;
        }
        
        location / {
                try_files $uri @frappe;
        }
        
        location @frappe {
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Frappe-Site-Name $host;
                proxy_set_header Host $host;
                proxy_set_header X-Use-X-Accel-Redirect True;
                proxy_read_timeout 120;
                proxy_redirect off;
                proxy_pass http://frappe-bench-frappe;
        }
        
        # error pages
        error_page 502 /502.html;
        location /502.html {
                root /usr/local/lib/python3.12/dist-packages/bench/config/templates;
                internal;
        }
        
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        
        # optimizations
        sendfile on;
        keepalive_timeout 15;
        client_max_body_size 50m;
        client_body_buffer_size 16K;
        client_header_buffer_size 1k;
        
        # enable gzip compression
        gzip on;
        gzip_http_version 1.1;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_proxied any;
        gzip_vary on;
        gzip_types
                application/atom+xml
                application/javascript
                application/json
                application/rss+xml
                application/vnd.ms-fontobject
                application/x-font-ttf
                application/font-woff
                application/x-web-app-manifest+json
                application/xhtml+xml
                application/xml
                font/opentype
                image/svg+xml
                image/x-icon
                text/css
                text/plain
                text/x-component;
}
